  /api/diagnostics:
    get:
      tags: [Diagnostics]
      summary: Read redacted server diagnostics
      description: |
        Administrator-only. Diagnostics include runtime health, WebSocket
        counts, provider configuration state, active runs, and recent errors.
        Sensitive environment values and credential-shaped text are redacted,
        but the endpoint still exposes operational state and must not be shared
        publicly.
      responses:
        '200':
          description: Redacted diagnostics snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnostics' }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the diagnostics route scope plus an admin, system, or wildcard scope. }

  /api/diagnostics/refresh:
    post:
      tags: [Diagnostics]
      summary: Mark diagnostics manually refreshed and return a fresh snapshot
      responses:
