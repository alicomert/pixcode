                      protocol: { type: string, enum: [pixcode.remote-console-layout.v1] }
                      mobileFirst: { type: boolean, enum: [true] }
                      sections: { type: array, items: { type: object, additionalProperties: true } }
                      maxVisibleProjects: { type: integer, enum: [4] }
        '401': { description: Authentication required. }
        '403': { description: Scoped API key lacks the remote read scope. }

  /api/webhooks:
    get:
      tags: [Webhooks]
      summary: List outbound webhook subscriptions and supported event types
      description: Administrator-only. Signing secrets are never returned.
      responses:
        '200':
          description: Webhooks and supported event types.
          content:
            application/json:
              schema:
                type: object
                required: [success, eventTypes, webhooks]
                properties:
                  success: { type: boolean, enum: [true] }
                  eventTypes: { type: array, items: { type: string } }
                  webhooks: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the webhooks route scope plus an admin, system, or wildcard scope. }
    post:
      tags: [Webhooks]
      summary: Create an outbound webhook subscription
      description: |
        Administrator-only. Delivery signs its JSON body with
        `X-Pixcode-Signature-256: sha256=<hmac>`, uses a ten-second timeout,
        retries at most once, and never follows redirects. Private, loopback,
        link-local, multicast, and cloud metadata destinations are rejected by
        default; `PIXCODE_ALLOW_PRIVATE_WEBHOOK=1` is an explicit local
        integration opt-in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
      responses:
        '201':
          description: Webhook created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  webhook: { $ref: '#/components/schemas/Webhook' }
        '400': { description: Invalid webhook URL or payload. }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the webhooks route scope plus an admin, system, or wildcard scope. }

  /api/webhooks/{id}:
    patch:
      tags: [Webhooks]
      summary: Update an outbound webhook subscription
