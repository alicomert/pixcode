openapi: 3.1.0
info:
  title: Pixcode REST API
  version: 1.64.2
  description: |
    Curated REST API reference for Pixcode — the multi-CLI web UI for Claude
    Code, Cursor CLI, Codex, Gemini CLI, Qwen Code, OpenCode, and NanoClaw.

    The running server exposes its canonical discovery document at
    `GET /api/public/manifest` and its machine-readable API fragment at
    `GET /api/public/openapi`. This bundled file is a release snapshot of the
    core REST surface; use the runtime documents for feature discovery, while
    treating this bundled file as the stable, curated reference for documented
    integrations. Browser WebSocket protocol frames and UI-private internals
    are intentionally outside this REST contract.

    The pre-1.55 `/api/orchestration/*` workflow surface is retired. Use
    `/api/nanoclaw/*` (or its `/api/tasks/*` alias) for multi-CLI tasks and
    schedules, and `/api/production-agent-loop/*` for admin review and CI
    automation.

    ## Authentication

    Most endpoints require authentication. Two schemes are accepted:

    - **JWT cookie** (`token` HTTP-only cookie) — set automatically when the
      browser logs in via `POST /api/auth/login`.
    - **API key** (`Authorization: Bearer px_...`) — generated under
      Settings → API. Keys are revocable and may carry least-privilege scopes.
      Legacy `ck_...` keys remain accepted for older installations.

    Endpoints flagged `apiKey` accept both. Raw `?token=` and `?apiKey=` query
    credentials are disabled by default; set `PIXCODE_ALLOW_QUERY_CREDENTIALS=1`
    only for legacy EventSource clients.

    ## Streaming endpoints

    Three classes of endpoint stream beyond plain JSON:

    - **WebSocket** (`/ws`, `/shell`) — chat/session bidirectional traffic. A
      browser should first call `POST /api/auth/stream-ticket` and pass the
      single-use `?streamTicket=` value on the exact WebSocket path. API clients
      may use an `Authorization` header during a native WebSocket handshake.
    - **SSE** (Server-Sent Events) — long-running jobs. Each `data:` frame
      contains a JSON event; the stream ends with `event: done` or `event: error`.
    - **NDJSON** — provider chat output (one JSON event per line) when the
      backend forwards from a CLI's `--format json` mode.

    ## Errors

    JSON error bodies are route-specific for backwards compatibility. Clients
    should always branch on the HTTP status and then read the documented
    `error`, `message`, or `ok:false` field for that endpoint. The runtime
    discovery document at `/api/public/openapi` is authoritative for the
    installed server.

  contact:
    name: Pixcode on GitHub
    url: https://github.com/alicomert/pixcode
  license:
    name: MIT
    url: https://opensource.org/license/mit/

servers:
  - url: http://localhost:3001
    description: Local development server
  - url: '{protocol}://{host}'
    description: Self-hosted Pixcode instance
    variables:
      protocol:
        enum: [http, https]
        default: http
      host:
        default: localhost:3001

tags:
  - name: System
    description: Health, version, and self-update.
  - name: Authentication
    description: Login, register, JWT lifecycle, API keys.
  - name: Projects
    description: Project CRUD and session enumeration.
  - name: Files
    description: Project filesystem read/write and directory traversal.
  - name: Sessions
    description: Conversation sessions across providers.
  - name: Git
    description: Git status, diffs, branches, commits, push/pull.
  - name: Providers
    description: Multi-CLI provider auth, install, sessions, configuration.
  - name: NanoClaw
    description: Multi-CLI agent runs, schedules, messaging, and task lifecycle.
  - name: Production Agent Loop
    description: Admin-only review, CI repair, scheduler, checkpoint, and release automation.
  - name: Network
    description: LAN discovery, UPnP, public tunnel.
  - name: Settings
    description: User-scoped preferences and notification channels.
  - name: Search
    description: Full-text search across conversations.
  - name: MCP
    description: Model Context Protocol servers and tooling.
  - name: Diagnostics
    description: Redacted administrator diagnostics and support bundles.
  - name: Remote
    description: Optional outbound Pixcode health checks and mobile control-room views. Configuring an endpoint does not redirect browser sessions.
  - name: Webhooks
    description: Administrator-managed outbound event subscriptions.
  - name: Terminal
    description: Authenticated HTTP helpers for visible provider terminal sessions.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>` — token may be a JWT (issued by
        `/api/auth/login`) or an API key (prefix `px_`, generated under
        Settings → API). Legacy `ck_` keys are still accepted. Scoped keys are
        checked against the method/path group before a request reaches a route.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Alternative for tools that can't set `Authorization`. Accepts the same
        `px_...` keys as `bearerAuth`; legacy `ck_...` keys remain accepted.
        Either header works on every secured endpoint — pick whichever your
        client supports. Browser SSE/WebSocket clients should use a one-shot
        stream ticket instead of putting a reusable credential in a URL.
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: HTTP-only `token` cookie set by `/api/auth/login`.

  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: ROUTE_NOT_FOUND }
            message: { type: string }

    Health:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        timestamp: { type: string, format: date-time }
        version:
          type: string
          description: Server version (matches semver `MAJOR.MINOR.PATCH`).
          example: 1.64.2
        installMode:
          type: string
          enum: [git, npm-global, runtime-dir, docker]

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email, nullable: true }
        created_at: { type: string, format: date-time }

    AuthStatus:
      type: object
      properties:
        success: { type: boolean }
        isAuthenticated: { type: boolean }
        needsSetup: { type: boolean, description: 'true if no users exist yet — UI shows registration screen.' }
        user: { $ref: '#/components/schemas/User' }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        success: { type: boolean }
        token: { type: string, description: JWT (also set as `token` cookie). }
        user: { $ref: '#/components/schemas/User' }

    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyName: { type: string }
        apiKey: { type: string, description: 'Format: `px_<64-hex>`. Returned in full on creation only. Legacy `ck_<32-hex>` keys remain valid.' }
        key_name: { type: string, description: 'Legacy list-field alias.' }
        api_key: { type: string, description: 'Masked list-field alias; full value is never returned after creation.' }
        scopes:
          type: array
          items: { type: string }
          description: Least-privilege method/path scopes. Legacy keys may have an empty list; new keys default to `projects:read` when omitted.
        created_at: { type: string, format: date-time }
        last_used: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean, description: 'Legacy numeric/boolean field depending on client version.' }

    Project:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        path: { type: string }
        fullPath: { type: string }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionMeta' }

    SessionMeta:
      type: object
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        provider:
          type: string
          enum: [claude, cursor, codex, gemini, qwen, opencode]
        lastActivity: { type: string, format: date-time }

    GitStatus:
      type: object
      properties:
        branch: { type: string }
        ahead: { type: integer }
        behind: { type: integer }
        modified: { type: array, items: { type: string } }
        added: { type: array, items: { type: string } }
        deleted: { type: array, items: { type: string } }
        untracked: { type: array, items: { type: string } }

    ProviderInfo:
      type: object
      properties:
        id:
          type: string
          enum: [claude, cursor, codex, gemini, qwen, opencode]
        installed: { type: boolean }
        authenticated: { type: boolean }
        version: { type: string, nullable: true }
        binaryPath: { type: string, nullable: true }

    InstallJob:
      type: object
      properties:
        jobId: { type: string }
        provider: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }

    GitHubOAuthStart:
      type: object
      required: [success, authUrl, callbackOrigin, expiresIn]
      properties:
        success: { type: boolean, enum: [true] }
        authUrl:
          type: string
          format: uri
          description: GitHub authorization URL containing a short-lived, single-use state.
        callbackOrigin:
          type: string
          format: uri
          description: Origin that the OAuth popup uses for its completion postMessage.
        expiresIn:
          type: integer
          minimum: 1
          description: OAuth state lifetime in seconds (currently 600).

    GitConfig:
      type: object
      required: [success, gitName, gitEmail, hasGithubToken, storage]
      properties:
        success: { type: boolean }
        gitName: { type: string, nullable: true }
        gitEmail: { type: string, format: email, nullable: true }
        hasGithubToken:
          type: boolean
          description: Whether an encrypted GitHub credential is active; the credential itself is never returned.
        identityFile: { type: string, nullable: true }
        storage: { type: string, enum: [pixcode] }

    GitConfigInput:
      type: object
      required: [gitName, gitEmail]
      properties:
        gitName: { type: string, minLength: 1 }
        gitEmail: { type: string, format: email }
        githubToken:
          type: string
          writeOnly: true
          maxLength: 512
          description: >-
            Deprecated one-time compatibility fallback for private repositories.
            Prefer the browser GitHub OAuth flow at
            `/api/user/github/oauth/start`; tokens are encrypted and never
            returned in API responses.
        githubTokenName:
          type: string
          description: Optional label for the legacy credential.

    RemoteConnection:
      type: object
      required: [mode, remoteUrl, apiKeyPresent, updatedAt, lastHealth]
      properties:
        mode: { type: string, enum: [local, remote] }
        remoteUrl: { type: string, format: uri, nullable: true }
        apiKeyPresent: { type: boolean }
        updatedAt: { type: string, format: date-time, nullable: true }
        lastHealth:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/RemoteHealth' }
            - { type: 'null' }

    RemoteConnectionInput:
      type: object
      properties:
        mode: { type: string, enum: [local, remote], default: local }
        remoteUrl:
          type: string
          format: uri
          description: HTTP(S) endpoint for an outbound health check from this Pixcode server. It does not proxy browser, terminal, filesystem, or WebSocket traffic. HTTPS is recommended for public use.
        apiKey:
          type: string
          writeOnly: true
          maxLength: 512
          description: Optional remote `px_` API key; encrypted at rest and never returned.

    RemoteHealth:
      type: object
      required: [reachable, checkedAt, status, message]
      properties:
        reachable: { type: boolean }
        checkedAt: { type: string, format: date-time }
        status: { type: string, enum: [local, ok, http_error, timeout, network_error] }
        statusCode: { type: integer, nullable: true }
        message: { type: string }

    Webhook:
      type: object
      required: [id, name, url, enabled, events, createdAt, updatedAt, secretPresent]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        events:
          type: array
          items:
            type: string
            enum: [run.started, run.completed, run.failed, run.canceled, file.changed, approval.needed, approval.resolved, live_view.started, live_view.failed]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        secretPresent: { type: boolean, description: The signing secret is never returned. }
        lastDelivery:
          type: object
          nullable: true
          additionalProperties: true

    WebhookInput:
      type: object
      required: [url]
      properties:
        name: { type: string }
        url:
          type: string
          format: uri
          description: HTTP(S) destination; embedded credentials and private/metadata targets are rejected by default.
        secret:
          type: string
          writeOnly: true
          description: Optional HMAC-SHA256 signing secret; generated when omitted.
        enabled: { type: boolean, default: true }
        events:
          type: array
          items: { type: string }

    ControlRoomSnapshot:
      type: object
      required: [success, controlRoom]
      properties:
        success: { type: boolean, enum: [true] }
        controlRoom:
          type: object
          required: [protocol, generatedAt, maxProjects, mobileFirst, totals, projects, approvals, webhooks]
          properties:
            protocol: { type: string, enum: [pixcode.control-room.v1] }
            generatedAt: { type: string, format: date-time }
            maxProjects: { type: integer }
            mobileFirst: { type: boolean, enum: [true] }
            totals: { type: object, additionalProperties: true }
            projects: { type: array, items: { type: object, additionalProperties: true } }
            approvals: { type: array, items: { type: object, additionalProperties: true } }
            webhooks: { type: array, items: { $ref: '#/components/schemas/Webhook' } }

    Diagnostics:
      type: object
      required: [status, timestamp, version, runtime, memory, websocket, environment, credentials, providerHealth]
      properties:
        status: { type: string, enum: [ok] }
        timestamp: { type: string, format: date-time }
        version: { type: string }
        installMode: { type: string }
        runtime: { type: object, additionalProperties: true }
        memory: { type: object, additionalProperties: true }
        websocket: { type: object, additionalProperties: true }
        environment: { type: object, additionalProperties: true, description: Safe allowlisted values; sensitive values are redacted. }
        credentials: { type: object, additionalProperties: true, description: Boolean configured-state flags only. }
        notifications: { type: object, additionalProperties: true }
        providerHealth: { type: object, additionalProperties: true }
        activeRuns: { type: array, items: { type: object, additionalProperties: true } }
        recentErrors: { type: array, items: { type: object, additionalProperties: true } }

    TerminalOutput:
      type: object
      required: [active, provider, output, outputCursor, bufferStartCursor]
      properties:
        active: { type: boolean }
        provider: { type: string, enum: [claude, codex, cursor, gemini, qwen, opencode, grok] }
        projectPath: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        tabId: { type: string, nullable: true }
        updatedAt: { type: integer, nullable: true }
        matchStatus: { type: string, enum: [matched, legacy-latest, missing, ambiguous] }
        terminalState: { type: string, enum: [unknown, idle, busy, exited, completed, failed] }
        lifecycleState: { type: string }
        isBusy: { type: boolean }
        output: { type: string }
        outputCursor: { type: integer, minimum: 0 }
        bufferStartCursor: { type: integer, minimum: 0 }
        sinceCursor: { type: integer, nullable: true, minimum: 0 }
        message: { type: string, nullable: true }

security:
  - bearerAuth: []
  - apiKeyAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness + version probe
      description: |
        Public, unauthenticated. Returns server version and install mode so the
        UI can detect updates and stale daemons. Used by:

        - The version-upgrade modal — polls during/after `/api/system/update`
          to detect when the new version is up.
        - `useVersionCheck` — falls back to the bundle's baked
          `__PIXCODE_UI_VERSION__` if `version` is missing or non-semver.
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/system/update:
    post:
      tags: [System]
      summary: Self-update (SSE)
      description: |
        Streams the update process via SSE. Behavior depends on
        `installMode`:

        - **runtime-dir** (desktop wrapper): downloads the latest npm tarball,
          atomically swaps files, emits `done { selfRestarting: true }`, then
          `process.exit(42)` so the wrapper respawns. **Don't `POST /restart`
          when `selfRestarting` is true.**
        - **git/npm-global**: runs `git pull && npm install` or
          `npm install -g`. The supervising daemon may restart the server
          mid-stream — clients should treat a bare close + `/health` version
          bump as success.
      responses:
        '200':
          description: 'SSE stream of `event: log`, `event: progress`, `event: done`, `event: error`.'
          content:
            text/event-stream:
              schema: { type: string }

  /api/system/restart:
    post:
      tags: [System]
      summary: Restart the server process
      description: |
        Triggers a graceful exit; the supervising daemon (systemd/pm2/electron
        wrapper) is expected to respawn. Don't call after a `selfRestarting`
        update event — the wrapper has already been signalled.
      responses:
        '200':
          description: Restart scheduled.

  /api/auth/status:
    get:
      tags: [Authentication]
      summary: Probe authentication state
      description: Returns whether the current request carries a valid token, and whether the system has any users at all (`needsSetup`).
      security: []
      responses:
        '200':
          description: Auth status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatus' }

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register the first user
      description: Only allowed while `needsSetup` is true. Subsequent calls return 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Registered + auto-logged-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '403':
          description: Setup already complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login OK; sets `token` cookie + returns JWT in body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials.

  /api/auth/stream-ticket:
    post:
      tags: [Authentication]
      summary: Mint a one-shot SSE/WebSocket stream ticket
      description: |
        Exchanges the caller's JWT or API key for a short-lived, single-use
        ticket bound to the requested transport and exact path. Browser
        EventSource and WebSocket clients can pass the returned ticket as
        `?streamTicket=` only on that matching SSE or WebSocket path, without
        exposing a reusable credential in a URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, example: /api/nanoclaw/events }
                transport: { type: string, enum: [sse, ws] }
      responses:
        '200':
          description: Ticket minted.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt]
                properties:
                  ticket: { type: string, description: 'Single-use opaque value for ?streamTicket=' }
                  expiresAt: { type: string, format: date-time }
        '400': { description: Invalid path or transport. }
        '401': { description: Authentication required. }

  /api/auth/user:
    get:
      tags: [Authentication]
      summary: Current user
      responses:
        '200':
          description: Authenticated user details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: Clears the `token` cookie. JWT remains valid until expiry — server-side blacklist isn't implemented.
      responses:
        '200': { description: OK }

  /api/user/github/oauth/start:
    get:
      tags: [Authentication]
      summary: Start the browser GitHub OAuth connection flow
      description: |
        Authenticated, rate-limited OAuth bootstrap. The response contains a
        GitHub URL and a ten-minute, single-use state. Open `authUrl` in a
        browser popup. The callback saves the access token only in Pixcode's
        encrypted credential store and returns a small no-store HTML document
        that posts `pixcode-github-oauth` completion data to the validated
        opener origin; it never returns a GitHub token to the browser.

        `GITHUB_OAUTH_CLIENT_ID` and `GITHUB_OAUTH_CLIENT_SECRET` must be
        configured. The callback URL must be exactly
        `/api/user/github/oauth/callback`, use HTTPS except on loopback, and
        can be explicitly pinned with `GITHUB_OAUTH_CALLBACK_URL`.
      parameters:
        - name: openerOrigin
          in: query
          required: false
          schema: { type: string, format: uri }
          description: Optional validated http(s) UI origin for the popup postMessage target.
      responses:
        '200':
          description: OAuth authorization URL created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubOAuthStart' }
        '401': { description: Authentication required. }
        '403': { description: Scoped API key lacks the settings write scope. }
        '429': { description: OAuth start rate limit exceeded. }
        '500': { description: Unsafe or missing callback URL configuration. }
        '501': { description: GitHub OAuth is not configured on this server. }

  /api/user/github/oauth/callback:
    get:
      tags: [Authentication]
      summary: GitHub OAuth browser callback
      description: |
        Public only so GitHub can redirect to it. It is protected by the
        short-lived, single-use state minted by `/oauth/start`, exchanges the
        authorization code server-side, and returns a no-store popup HTML
        completion document. Do not call this endpoint directly from an API
        client and do not expect a JSON body or GitHub access token.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error_description, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Popup completion document, content: { text/html: { schema: { type: string } } } }
        '400': { description: Invalid, expired, reused, or cancelled OAuth state. }
        '501': { description: GitHub OAuth is not configured. }
        '502': { description: GitHub token exchange or profile lookup failed. }

  /api/user/git-config:
    get:
      tags: [Settings]
      summary: Read the current user's Pixcode Git identity and GitHub credential state
      responses:
        '200':
          description: User-scoped Git identity; no GitHub credential value is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitConfig' }
        '401': { description: Authentication required. }
        '403': { description: Scoped API key lacks the settings read scope. }
    post:
      tags: [Settings]
      summary: Save the current user's Pixcode Git identity
      description: |
        Writes identity to Pixcode storage and, when possible, its isolated
        Pixcode gitconfig. It never modifies the system `git config --global`.
        `githubToken` is a legacy compatibility path only; connect GitHub via
        OAuth first whenever possible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitConfigInput' }
      responses:
        '200':
          description: Git identity saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitConfig' }
        '400': { description: Git name/email is missing, email is invalid, or legacy token exceeds 512 characters. }
        '401': { description: Authentication required. }
        '403': { description: Scoped API key lacks the settings write scope. }
        '500': { description: Git identity persistence failed. }

  /api/settings/api-keys:
    get:
      tags: [Authentication]
      summary: List user API keys
      responses:
        '200':
          description: List of keys in the `apiKeys` property (the `apiKey` field is returned only on creation; list fingerprints are masked).
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
    post:
      tags: [Authentication]
      summary: Create an API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyName]
              properties:
                keyName: { type: string, description: 'Human-readable label.' }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: 'Optional least-privilege scopes; omitted keys default to `projects:read`.'
      responses:
        '200':
          description: Key created. The full `api_key` value is returned **once** — store it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }

  /api/settings/api-keys/{keyId}:
    delete:
      tags: [Authentication]
      summary: Delete an API key
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted. }

  /api/settings/api-keys/{keyId}/toggle:
    patch:
      tags: [Authentication]
      summary: Activate / deactivate an API key
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive: { type: boolean }
      responses:
        '200': { description: Updated. }

  /api/settings/api-keys/{keyId}/scopes:
    patch:
      tags: [Authentication]
      summary: Replace API key scopes
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200': { description: Scope set updated. }
        '400': { description: At least one allowed scope is required. }

  /api/projects:
    get:
      tags: [Projects]
      summary: List all projects
      description: Walks `~/.claude/projects/*` plus any registered workspaces and returns a unified list. Sessions are flattened by provider.
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }

  /api/projects/quick-start:
    post:
      tags: [Projects]
      summary: Open or create a project from an absolute path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: 'Absolute filesystem path.' }
      responses:
        '200':
          description: Project record (created if it didn't exist).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }

  /api/projects/{projectName}/rename:
    put:
      tags: [Projects]
      summary: Rename project display
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
      responses:
        '200': { description: Renamed. }

  /api/projects/{projectName}:
    delete:
      tags: [Projects]
      summary: Delete (deregister) a project
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted. }

  /api/projects/{projectName}/sessions:
    get:
      tags: [Sessions]
      summary: List sessions for a project
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sessions sorted by lastActivity desc.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionMeta' }

  /api/projects/{projectName}/sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: Delete a session
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted. }

  /api/sessions/{sessionId}/rename:
    put:
      tags: [Sessions]
      summary: Rename a session
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        '200': { description: Renamed. }

  /api/sessions/{sessionId}/messages:
    get:
      tags: [Sessions]
      summary: Get session message history
      description: |
        Note: this is mounted at `/api/sessions`, NOT under `/api/projects` — the
        `projectName` is supplied as a query parameter rather than a path
        segment. The mount lives in `server/routes/messages.js`.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: projectName, in: query, required: true, schema: { type: string }, description: Pixcode project the session belongs to. }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Normalized message stream.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  hasMore: { type: boolean }

  /api/search/conversations:
    get:
      tags: [Search]
      summary: Full-text search across all sessions
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: Search query. }
        - { name: provider, in: query, required: false, schema: { type: string, enum: [claude, cursor, codex, gemini, qwen, opencode] } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Ranked matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }

  /api/projects/{projectName}/files:
    get:
      tags: [Files]
      summary: List files in a project subtree
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: false, schema: { type: string }, description: Subdirectory relative to project root. }
      responses:
        '200':
          description: Directory listing.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    path: { type: string }
                    type: { type: string, enum: [file, directory] }
                    size: { type: integer, nullable: true }
    delete:
      tags: [Files]
      summary: Delete a file or folder (path in body)
      description: |
        Same path as the listing endpoint above — discriminated by HTTP method.
        The target's project-relative path goes in the body, NOT the query
        string (so directory deletes can't be partially URL-encoded into a
        broken state).
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: 'Project-relative path of the file or directory to delete.' }
                type: { type: string, enum: [file, directory], description: 'Optional hint; server detects automatically if omitted.' }
      responses:
        '200': { description: Deleted. }

  /api/projects/{projectName}/file:
    get:
      tags: [Files]
      summary: Read a single file
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: File contents (utf-8 text or base64 binary).
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
                  encoding: { type: string, enum: [utf-8, base64] }
    put:
      tags: [Files]
      summary: Overwrite a file
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path: { type: string }
                content: { type: string }
      responses:
        '200': { description: Saved. }

  /api/projects/{projectName}/files/create:
    post:
      tags: [Files]
      summary: Create a new file or folder
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, type]
              properties:
                path: { type: string }
                type: { type: string, enum: [file, directory] }
                content: { type: string, description: 'Initial content for files; ignored for directories.' }
      responses:
        '201': { description: Created. }

  /api/projects/{projectName}/files/rename:
    put:
      tags: [Files]
      summary: Rename / move a file
      parameters:
        - { name: projectName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPath, newPath]
              properties:
                oldPath: { type: string }
                newPath: { type: string }
      responses:
        '200': { description: Renamed. }


  /api/browse-filesystem:
    get:
      tags: [Files]
      summary: Native filesystem browser (outside project tree)
      description: Used by Quick Start to let the user pick a folder anywhere on the host. Honours `~` expansion.
      parameters:
        - { name: path, in: query, required: false, schema: { type: string, default: '~' } }
      responses:
        '200':
          description: Directory listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  parent: { type: string, nullable: true }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        type: { type: string, enum: [file, directory] }

  /api/git/status:
    get:
      tags: [Git]
      summary: Working tree status
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Git status snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitStatus' }

  /api/git/diff:
    get:
      tags: [Git]
      summary: Unified diff for one file or the whole tree
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
        - { name: file, in: query, required: false, schema: { type: string } }
        - { name: staged, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Diff text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  diff: { type: string }

  /api/git/branches:
    get:
      tags: [Git]
      summary: List local + remote branches
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Branch list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { type: string }
                  local: { type: array, items: { type: string } }
                  remote: { type: array, items: { type: string } }

  /api/git/commit:
    post:
      tags: [Git]
      summary: Create a commit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, message]
              properties:
                project: { type: string }
                message: { type: string }
                files: { type: array, items: { type: string }, description: 'When omitted, all staged changes are committed.' }
      responses:
        '200': { description: Commit created. }

  /api/git/push:
    post:
      tags: [Git]
      summary: Push to remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project: { type: string }
                remote: { type: string, default: origin }
                branch: { type: string }
                force: { type: boolean, default: false }
      responses:
        '200': { description: Pushed. }

  /api/git/pull:
    post:
      tags: [Git]
      summary: Pull from remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project: { type: string }
      responses:
        '200': { description: Pulled. }

  /api/git/checkout:
    post:
      tags: [Git]
      summary: Switch branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, branch]
              properties:
                project: { type: string }
                branch: { type: string }
      responses:
        '200': { description: Switched. }

  /api/providers/credentials:
    get:
      tags: [Providers]
      summary: List stored credentials across providers
      description: Returns a sanitised inventory of API keys / OAuth tokens Pixcode is currently holding for each provider. Real secret values are NOT returned — only presence + masked tail.
      responses:
        '200':
          description: Credentials inventory.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    hasCredential: { type: boolean }
                    masked: { type: string, nullable: true, example: '...beef' }

  /api/providers/{provider}/auth/status:
    get:
      tags: [Providers]
      summary: Auth status for a single provider
      description: |
        Returns whether the provider's CLI is installed, whether it has a
        valid auth credential (api key / OAuth token), and the resolved
        binary path the spawn layer will use.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [claude, cursor, codex, gemini, qwen, opencode] } }
      responses:
        '200':
          description: Auth status snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderInfo' }

  /api/providers/{provider}/auth/api-key:
    post:
      tags: [Providers]
      summary: Save / replace an API-key credential for a provider
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey: { type: string }
                baseUrl: { type: string, description: Optional override (e.g. self-hosted Anthropic compat endpoint). }
      responses:
        '200': { description: Credential saved. }

  /api/providers/{provider}/oauth-paste:
    post:
      tags: [Providers]
      summary: Paste an OAuth callback URL to complete login
      description: |
        For providers (Claude, Cursor) whose login flow opens a browser tab and
        bounces back to a URL the user copies into Pixcode. The handler parses
        the token and stores it as the active credential.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '200': { description: Token extracted and stored. }
        '400': { description: URL did not contain a recognisable token. }

  /api/providers/{provider}/models:
    get:
      tags: [Providers]
      summary: List models the provider's CLI exposes
      description: |
        Pixcode caches the model list per provider on first call (or when the
        cache is busted via `DELETE …/models/cache`). Each entry is the
        `provider/model` form OpenCode expects.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Model catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, example: 'opencode/gpt-5.2' }
                    name: { type: string }
                    contextWindow: { type: integer, nullable: true }

  /api/providers/{provider}/models/cache:
    delete:
      tags: [Providers]
      summary: Bust the cached model list for one provider
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cache cleared; next GET re-fetches. }

  /api/providers/{provider}/install:
    post:
      tags: [Providers]
      summary: Install / update a provider CLI in the Pixcode sandbox
      description: |
        Installs the provider's npm package into `~/.pixcode/cli-bin/` (no
        `-g`, no sudo/UAC). Returns a `jobId` immediately; subscribe to
        `/install/{jobId}/stream` for live logs.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallJob' }

  /api/providers/{provider}/install/{jobId}/stream:
    get:
      tags: [Providers]
      summary: Stream install job output (SSE)
      description: Replays buffered output, then streams live until the job ends. Send `Last-Event-ID` to resume after disconnect.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'SSE event stream — `event: log`, `event: status`, `event: done`, `event: error`.'
          content:
            text/event-stream:
              schema: { type: string }

  /api/providers/{provider}/install/{jobId}:
    delete:
      tags: [Providers]
      summary: Cancel an in-flight install
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled. }

  /api/providers/{provider}/mcp/servers:
    get:
      tags: [MCP]
      summary: List MCP servers configured for one provider
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: MCP server list (matches the provider's native config schema).
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
    post:
      tags: [MCP]
      summary: Add or replace an MCP server entry
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, command]
              properties:
                name: { type: string }
                command: { type: string }
                args: { type: array, items: { type: string } }
                env: { type: object, additionalProperties: { type: string } }
                scope: { type: string, enum: [local, user], default: user }
      responses:
        '200': { description: Server saved. }

  /api/providers/{provider}/mcp/servers/{name}:
    delete:
      tags: [MCP]
      summary: Remove an MCP server entry
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed. }

  /api/providers/mcp/servers/global:
    post:
      tags: [MCP]
      summary: Add an MCP server to every provider that supports MCP
      description: Convenience endpoint that fans out the same server config to all MCP-capable providers (Claude, Cursor, Codex, OpenCode). Per-provider edits override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, command]
              properties:
                name: { type: string }
                command: { type: string }
                args: { type: array, items: { type: string } }
                env: { type: object, additionalProperties: { type: string } }
      responses:
        '200': { description: Server fanned out. }

  /api/providers/{provider}/config-files:
    get:
      tags: [Providers]
      summary: List config files Pixcode knows about for a provider
      description: |
        Returns the catalog of editable config files for a provider — typically
        `settings.json`, `auth.json`, `opencode.json`, etc. Each entry has an
        opaque `fileId` used by `GET/PUT …/{fileId}`.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Config file catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    fileId: { type: string }
                    path: { type: string }
                    label: { type: string }
                    exists: { type: boolean }
                    size: { type: integer, nullable: true }

  /api/providers/{provider}/config-files/{fileId}:
    get:
      tags: [Providers]
      summary: Read a provider config file's contents
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File contents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
                  path: { type: string }
                  encoding: { type: string, enum: [utf-8] }
    put:
      tags: [Providers]
      summary: Overwrite a provider config file
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: fileId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200': { description: Saved. }
        '400': { description: Content failed validation (e.g. malformed JSON). }

  /api/nanoclaw/help:
    get:
      tags: [NanoClaw]
      summary: NanoClaw API help and curl cookbook
      description: Returns the active NanoClaw REST surface. The same router is available under `/api/tasks/*` for the UI alias.
      responses:
        '200':
          description: Machine-readable help.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/nanoclaw/status:
    get:
      tags: [NanoClaw]
      summary: NanoClaw engine status
      responses:
        '200':
          description: Engine and channel status.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/nanoclaw/channels:
    get:
      tags: [NanoClaw]
      summary: Connected messaging channel capabilities
      responses:
        '200':
          description: Telegram and WhatsApp capability flags.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/nanoclaw/agents:
    get:
      tags: [NanoClaw]
      summary: Available multi-CLI agents
      responses:
        '200':
          description: Provider/agent inventory.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/nanoclaw/run:
    post:
      tags: [NanoClaw]
      summary: Run a multi-CLI agent immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, maxLength: 20000 }
                agentType: { type: string, example: codex }
                model: { type: string }
                projectId: { type: string, default: general }
                projectPath: { type: string }
                sessionId: { type: string }
      responses:
        '200': { description: Agent completed successfully. }
        '400': { description: Invalid prompt or project. }
        '403': { description: Project or task scope denied. }
        '502': { description: Agent failed. }

  /api/nanoclaw/tasks:
    get:
      tags: [NanoClaw]
      summary: List scheduled tasks
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Visible scheduled tasks. }
    post:
      tags: [NanoClaw]
      summary: Create a scheduled task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                schedule_type: { type: string, enum: [once, interval, cron], default: once }
                schedule_value: { type: string }
                projectId: { type: string, default: general }
      responses:
        '201': { description: Task created. }
        '400': { description: Invalid schedule or prompt. }

  /api/nanoclaw/tasks/{taskId}:
    get:
      tags: [NanoClaw]
      summary: Read one scheduled task
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Task detail and recent run logs. }
        '404': { description: Task not found. }
    patch:
      tags: [NanoClaw]
      summary: Update a scheduled task
      parameters:
