      responses:
        '200':
          description: Control-room snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlRoomSnapshot' }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the remote route scope plus an admin, system, or wildcard scope. }
        '500': { description: Control-room snapshot could not be built. }

  /api/remote/console-layout:
    get:
