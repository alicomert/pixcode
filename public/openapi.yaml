        '403': { description: Administrator role required. Explicitly scoped API keys also need the diagnostics route scope plus an admin, system, or wildcard scope. }

  /api/remote/config:
    get:
      tags: [Remote]
      summary: Read optional outbound remote health configuration
      description: Administrator-only. The remote API key is encrypted at rest and returned only as `apiKeyPresent`. Saving this configuration does not turn the current browser into a remote client.
      responses:
        '200':
          description: Public-safe remote connection configuration.
          content:
            application/json:
              schema:
                type: object
                required: [success, connection]
                properties:
                  success: { type: boolean, enum: [true] }
                  connection: { $ref: '#/components/schemas/RemoteConnection' }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the remote route scope plus an admin, system, or wildcard scope. }
    put:
      tags: [Remote]
      summary: Save optional outbound remote health configuration
      description: |
        Administrator-only. Remote URLs reject embedded credentials and, by
        default, private, loopback, link-local, multicast, and cloud metadata
        targets. Set `PIXCODE_ALLOW_PRIVATE_REMOTE=1` only for a deliberate
        private-network bridge. This configuration is an outbound health check,
        not a browser, terminal, filesystem, or WebSocket proxy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoteConnectionInput' }
      responses:
        '200':
          description: Saved public-safe configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  connection: { $ref: '#/components/schemas/RemoteConnection' }
        '400': { description: Invalid remote mode, URL, or API key. }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the remote route scope plus an admin, system, or wildcard scope. }

  /api/remote/check:
    post:
      tags: [Remote]
      summary: Check outbound remote Pixcode reachability
      description: |
        Administrator-only. With a body, validates and checks that temporary
        connection input; otherwise checks saved configuration. Health requests
        use a five-second timeout and do not follow redirects.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoteConnectionInput' }
      responses:
        '200':
          description: Reachability result and public-safe current configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  health: { $ref: '#/components/schemas/RemoteHealth' }
                  connection: { $ref: '#/components/schemas/RemoteConnection' }
        '400': { description: Invalid or unsafe remote configuration. }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the remote route scope plus an admin, system, or wildcard scope. }

  /api/remote/control-room:
    get:
      tags: [Remote]
      summary: Read the mobile-first control-room snapshot
      description: |
        Administrator-only operational snapshot. It includes project summaries,
