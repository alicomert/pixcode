      responses:
        '200':
          description: Webhook updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  webhook: { $ref: '#/components/schemas/Webhook' }
        '400': { description: Invalid webhook URL or payload. }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the webhooks route scope plus an admin, system, or wildcard scope. }
    delete:
      tags: [Webhooks]
      summary: Delete an outbound webhook subscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Webhook deleted. }
        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the webhooks route scope plus an admin, system, or wildcard scope. }
        '404': { description: Webhook not found. }

  /api/webhooks/test:
    post:
