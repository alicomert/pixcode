        '401': { description: Authentication required. }
        '403': { description: Administrator role required. Explicitly scoped API keys also need the webhooks route scope plus an admin, system, or wildcard scope. }
        '500': { description: Unexpected test delivery failure. }

  /api/shell/sessions/terminate:
    post:
      tags: [Terminal]
      summary: Terminate visible provider terminal sessions for a workspace
      description: |
        Terminates non-plain-shell PTYs for the selected provider and authorized
        workspace. Ordinary users can affect only their own sessions; admins
        may affect all matching sessions. Scoped API keys require
        `terminal:launch` and project path access is always checked.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [claude, codex, cursor, gemini, qwen, opencode, grok], default: claude }
                projectPath: { type: string, description: Absolute authorized workspace path; default is the caller's private workspace (or admin home directory). }
      responses:
        '200':
          description: Matching sessions terminated.
          content:
            application/json:
              schema:
                type: object
                required: [success, killedSessions]
                properties:
                  success: { type: boolean, enum: [true] }
                  killedSessions: { type: integer, minimum: 0 }
        '400': { description: Unsupported provider. }
        '401': { description: Authentication required. }
        '403': { description: Project access or terminal launch scope denied. }

  /api/shell/sessions/provider-output:
    get:
      tags: [Terminal]
      summary: Read buffered output from an authorized provider terminal session
      description: |
        Returns ANSI-stripped output. Select an exact `tabId` or `sessionId`
        when multiple matching sessions are active; legacy calls without one
        receive the most recently updated match. Output is capped at 20,000
        characters and cursor values are byte offsets into the retained PTY
        buffer.
      parameters:
        - { name: provider, in: query, required: false, schema: { type: string, enum: [claude, codex, cursor, gemini, qwen, opencode, grok], default: claude } }
        - { name: projectPath, in: query, required: false, schema: { type: string } }
        - { name: tabId, in: query, required: false, schema: { type: string } }
        - { name: sessionId, in: query, required: false, schema: { type: string } }
        - { name: maxChars, in: query, required: false, schema: { type: integer, minimum: 1000, maximum: 20000, default: 12000 } }
        - { name: sinceCursor, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Active, missing, or legacy-selected terminal output state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalOutput' }
        '400': { description: Unsupported provider. }
        '401': { description: Authentication required. }
        '403': { description: Project access or terminal launch scope denied. }
        '409': { description: Multiple sessions match; provide tabId or sessionId. }

  /api/shell/sessions/provider-input:
    post:
      tags: [Terminal]
      summary: Write input to an authorized running provider terminal session
      description: |
        Writes at most 262,144 characters by default
        (`PIXCODE_SHELL_HTTP_INPUT_MAX_CHARS` can change the limit). `submit`
        defaults to true. `inline` replaces the current terminal line and
        submits immediately; `deferred-enter` writes first and sends Enter
        shortly afterward. This helper targets provider PTYs only, never a
        plain terminal shell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [claude, codex, cursor, gemini, qwen, opencode, grok], default: claude }
                projectPath: { type: string }
                tabId: { type: string }
                sessionId: { type: string }
                input: { type: string }
                submit: { type: boolean, default: true }
                submitMode: { type: string, enum: [inline, deferred-enter], default: inline }
      responses:
        '200':
          description: Input was accepted by the PTY.
          content:
            application/json:
              schema:
                type: object
                required: [ok, provider, wrote, submitted, submitMode, bytes]
                properties:
                  ok: { type: boolean, enum: [true] }
                  provider: { type: string }
                  projectPath: { type: string }
                  sessionId: { type: string, nullable: true }
                  tabId: { type: string, nullable: true }
                  wrote: { type: boolean, enum: [true] }
                  submitted: { type: boolean }
                  submitMode: { type: string, enum: [inline, deferred-enter] }
                  bytes: { type: integer, minimum: 0 }
                  outputCursorBefore: { type: integer, minimum: 0 }
                  outputCursorAfter: { type: integer, minimum: 0 }
        '400': { description: Unsupported provider. }
        '401': { description: Authentication required. }
        '403': { description: Project access or terminal launch scope denied. }
        '404': { description: No matching running provider terminal session. }
        '409': { description: Multiple running sessions match; provide tabId or sessionId. }
        '413': { description: Terminal input exceeds the configured character limit. }
        '500': { description: PTY input write failed. }

  /api/network/endpoints:
