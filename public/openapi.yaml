  /api/agent:
    post:
      tags: [Providers]
      summary: External REST entry point (API-key authenticated)
      description: |
        One-shot non-interactive run for automation/CI. Spawns the chosen
        provider, optionally cloning a GitHub repo first, optionally cutting
        a branch + opening a PR. **API key required** — accepts the same `px_`
        keys as the rest of the API on `Authorization: Bearer` or `X-API-Key`.
        Legacy `ck_` keys remain accepted. The URL form (`?apiKey=`) is
        disabled by default because credentials in URLs leak through browser
        history and proxy logs; enable `PIXCODE_ALLOW_QUERY_CREDENTIALS=1`
        only for an un-migrated legacy EventSource client.

        Default response is an SSE stream of provider-native events; pass
        `stream: false` to buffer and return JSON.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: Prompt text to send to the agent.
                provider:
                  type: string
                  enum: [claude, cursor, codex, gemini, qwen, opencode]
                  default: claude
                model:
                  type: string
                  description: Provider-specific model id (e.g. `opencode/gpt-5.2`).
                projectPath:
                  type: string
                  description: Absolute path on the host. Required if `githubUrl` is omitted.
                githubUrl:
                  type: string
                  format: uri
                  description: Clone this repo before running. Mutually inclusive with `projectPath` (used as the clone target if both are given).
                githubToken:
                  type: string
                  description: Deprecated one-request compatibility override. Normally connect GitHub with the OAuth flow in Settings; when omitted, Pixcode uses the active encrypted GitHub credential for the user.
                branchName:
                  type: string
                  description: 'Cutting `branchName` implies `createBranch: true`.'
                createBranch:
                  type: boolean
                  default: false
                createPR:
                  type: boolean
                  default: false
                sessionId:
                  type: string
                  description: Resume an existing session instead of starting a new one.
                stream:
                  type: boolean
                  default: true
                  description: 'Set false to buffer to a single JSON response.'
                cleanup:
                  type: boolean
                  default: true
                  description: When `githubUrl` was used, delete the temp clone after the run.
      responses:
        '200':
          description: |
            When `stream:true` — SSE stream of provider events. When `stream:false` — final JSON payload with `text` + `sessionId` + `usage`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  sessionId: { type: string }
                  usage:
                    type: object
                    properties:
                      input: { type: integer }
                      output: { type: integer }
                      total: { type: integer }
                      cost: { type: number }
            text/event-stream:
              schema: { type: string }
        '400':
          description: 'Missing required fields, unknown provider, or invalid GitHub URL.'
        '401':
          description: Missing or invalid API key.
