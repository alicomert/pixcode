name: Docker

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Additional tag to push alongside the template tag (e.g. v1.2.3, leave empty for none)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [claude-code, codex, gemini]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -euo pipefail
          TAGS="docker.io/pixelbytesoftware/pixcode:${{ matrix.template }}"
          if [ -n "$EXTRA_TAG" ]; then
            if [[ ! "$EXTRA_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "extra_tag contains unsupported characters" >&2
              exit 2
            fi
            TAGS="$TAGS,docker.io/pixelbytesoftware/pixcode:${{ matrix.template }}-$EXTRA_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/${{ matrix.template }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=${{ matrix.template }}

  # The published root image is the image consumed by docker-compose.yml. The
  # sandbox templates above intentionally remain separate because they carry
  # Docker Sandbox's agent base image and user tooling.
  root-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute root image tags
        id: tags
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAGS="docker.io/pixelbytesoftware/pixcode:latest"
          if [ -n "$EXTRA_TAG" ]; then
            if [[ ! "$EXTRA_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "extra_tag contains unsupported characters" >&2
              exit 2
            fi
            TAGS="$TAGS,docker.io/pixelbytesoftware/pixcode:$EXTRA_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push root Pixcode image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=pixcode-root
          cache-to: type=gha,mode=max,scope=pixcode-root
