name: Release Pixcode

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        default: 'v2.0.6'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        run: npm run check:version -- --tag "${{ inputs.tag || github.ref_name }}"
      - run: npm run build
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy is distributed as an AppImage. GitHub-hosted runners
          # do not expose FUSE, so force AppImage tools to self-extract.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: .
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Pixcode ${{ inputs.tag || github.ref_name }}
          releaseBody: Automated desktop builds
          # Keep the release private until every platform has uploaded its
          # installer. The publish job below verifies the expected assets.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish verified release
    needs: desktop
    if: ${{ needs.desktop.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Verify desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].name')"
          printf '%s\n' "$assets"
          grep -Eiq '\.exe$' <<<"$assets"
          grep -Eiq '\.dmg$' <<<"$assets"
          grep -Eiq '\.AppImage$' <<<"$assets"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  npm:
    name: Publish npm package
    needs: [desktop, publish]
    if: ${{ needs.desktop.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check package and release versions
        run: npm run check:version -- --tag "${{ inputs.tag || github.ref_name }}"
      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
