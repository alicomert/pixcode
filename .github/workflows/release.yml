name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version bump: patch, minor, major, or explicit (e.g. 1.27.0)'
        required: true
        default: 'patch'
        type: string
      release_name:
        description: 'Custom release name (optional, defaults to "Pixcode vX.Y.Z")'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - run: npm ci

      - name: Release
        env:
          # Keep workflow inputs in the environment rather than interpolating
          # them into shell source. This prevents a custom release name from
          # becoming executable shell syntax.
          RELEASE_INCREMENT: ${{ inputs.increment }}
          RELEASE_NAME: ${{ inputs.release_name }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          args=(--ci "--increment=${RELEASE_INCREMENT}")
          if [[ -n "${RELEASE_NAME:-}" ]]; then
            args+=("--github.releaseName=${RELEASE_NAME}")
          fi
          node scripts/release.mjs "${args[@]}"
