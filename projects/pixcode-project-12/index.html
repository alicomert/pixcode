<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binance Futures Dashboard</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="tabs">
            <button class="tab active" data-tab="favorites">Favorites</button>
            <button class="tab" data-tab="all">All</button>
          </div>
          <div class="search-container">
            <input type="text" id="symbol-search" placeholder="Search symbols..." />
          </div>
        </div>
        <div id="symbol-list" class="symbol-list"></div>
      </aside>
      <main class="main-content">
        <div class="chart-header">
          <div class="symbol-info">
            <span id="current-symbol" class="current-symbol">BTCUSDT</span>
            <span id="current-price" class="current-price">--</span>
            <span id="price-change" class="price-change">--</span>
          </div>
          <div class="interval-selector">
            <button class="interval-btn" data-interval="1m">1m</button>
            <button class="interval-btn" data-interval="5m">5m</button>
            <button class="interval-btn" data-interval="15m">15m</button>
            <button class="interval-btn active" data-interval="1h">1h</button>
            <button class="interval-btn" data-interval="4h">4h</button>
            <button class="interval-btn" data-interval="1d">1D</button>
          </div>
        </div>
        <div id="chart-container" class="chart-container"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
