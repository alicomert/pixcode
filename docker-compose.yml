# Minimal compose file for running Pixcode from the published image or a
# local build. `docker compose up -d` after `docker login` is enough.
services:
  pixcode:
    # Pin to a concrete tag in production — :latest is convenient for dev but
    # makes rollbacks lossy.
    image: pixelbytesoftware/pixcode:latest
    # For local platform builds, uncomment `build` and pass both Vite args;
    # the browser bundle cannot read VITE_* values supplied only at runtime.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     VITE_IS_PLATFORM: "${VITE_IS_PLATFORM:-false}"
    #     VITE_PLATFORM_AUTH_BYPASS: "${VITE_PLATFORM_AUTH_BYPASS:-false}"
    container_name: pixcode
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # SERVER_PORT mirrors what the backend binds inside the container; keep
      # this aligned with the port in EXPOSE/HEALTHCHECK if you change it.
      SERVER_PORT: "3001"
      HOST: "0.0.0.0"
      # Optional stable URL metadata. Set PUBLIC_URL for a real domain, or
      # PUBLIC_IP to advertise pixcode.<ip>.sslip.io / nip.io in the access UI.
      # Empty defaults keep local compose runs valid while still forwarding
      # host environment values when operators export them.
      PUBLIC_URL: "${PUBLIC_URL:-}"
      PUBLIC_IP: "${PUBLIC_IP:-}"
      PUBLIC_PROXY_DOMAIN: "${PUBLIC_PROXY_DOMAIN:-sslip.io}"
      PUBLIC_PROXY_PREFIX: "${PUBLIC_PROXY_PREFIX:-pixcode}"
      # The base compose file exposes Pixcode directly on HTTP. The optional
      # docker-compose.https.yml overlay changes this to HTTPS behind Caddy.
      PUBLIC_SCHEME: "${PUBLIC_SCHEME:-http}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # Browser stream clients should use short-lived streamTicket URLs. Keep
      # raw ?token/?apiKey credentials and platform auth bypass disabled unless
      # an operator explicitly opts into the legacy/proxy trust model.
      PIXCODE_ALLOW_QUERY_CREDENTIALS: "${PIXCODE_ALLOW_QUERY_CREDENTIALS:-0}"
      PIXCODE_ALLOW_PLATFORM_AUTH_BYPASS: "${PIXCODE_ALLOW_PLATFORM_AUTH_BYPASS:-0}"
      VITE_IS_PLATFORM: "${VITE_IS_PLATFORM:-false}"
      VITE_PLATFORM_AUTH_BYPASS: "${VITE_PLATFORM_AUTH_BYPASS:-false}"
      PIXCODE_SHELL_HTTP_INPUT_MAX_CHARS: "${PIXCODE_SHELL_HTTP_INPUT_MAX_CHARS:-262144}"
      # Pass TZ so logs/auth timestamps match the host — optional but nicer
      # in support threads.
      TZ: "${TZ:-UTC}"
    volumes:
      # Preserves the JSON auth store, provider-CLI install sandbox, and
      # anything else stored under ~/.pixcode. Legacy auth.db files are
      # migrated from this volume on first startup when present.
      - pixcode-data:/root/.pixcode
      # Expose the host's home directory read-write if you want Pixcode to
      # operate on your real projects. Omit this line for a fully sandboxed
      # deployment.
      # - ${HOME:-/home/you}:/projects

volumes:
  pixcode-data:
