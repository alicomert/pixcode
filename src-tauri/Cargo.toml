[package]
name = "pixcode"
version = "2.0.3"
description = "Pixcode desktop shell"
authors = ["Ali Comert and Pixcode Contributors"]
edition = "2021"

[lib]
name = "pixcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
